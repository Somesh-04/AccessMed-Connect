<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MedAI | AccessMed Connect</title>
  <link rel="stylesheet" href="./MedAI.css">
</head>
<body>

<div class="medai-layout">

  <!-- SIDEBAR -->
  <aside class="history-panel">
    <h3>🕘 History</h3>
    <ul id="historyList"></ul>
  </aside>

  <!-- SIDEBAR TOGGLE -->
  <button id="sidebarToggle" aria-label="Toggle sidebar">
    ☰
  </button>

  <!-- MAIN CONTENT -->
  <main class="medai-main">

    <header class="hero-header">
      <div class="hero-content">
        <img src="CCL.png" class="hero-logo" />
        <h1 class="hero-title">MedAI Assistant</h1>
        <p class="hero-tagline">AI-powered Medical Triage</p>
        <p class="hero-sub">Central Coalfields Limited</p>
      </div>
    </header>

    <div class="ref-card-container">
      <div class="ref-card">
        <h3>🧠 Describe your symptoms</h3>

        <div class="symptom-input-wrapper">
          <button type="button" class="add-report-btn" title="Add report">
            <span class="plus-icon">+</span>
          </button>

          <textarea
            id="symptoms"
            placeholder="Example: severe stomach pain with vomiting since morning"
          ></textarea>

          <input
            type="file"
            id="reportInput"
            accept="image/*,.pdf,.doc,.docx"
            hidden
          />
        </div>

        <button id="analyzeBtn">Analyze with MedAI</button>

        <div id="resultBox" class="hidden"></div>

        <p class="note">
          MedAI is an AI assistant, not a doctor. This is not a diagnosis.
        </p>
      </div>
    </div>

  </main>
</div>

<script src="MedAI.js"></script>
</body>
</html>
