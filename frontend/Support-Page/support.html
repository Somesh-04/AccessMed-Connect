<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support – Suggestion Box</title>
    <link rel="stylesheet" href="support.css">
</head>

<body>

    <!-- FLOATING PARTICLES BACKGROUND -->
    <div class="floating-particles"></div>

    <!-- SUPPORT PAGE HEADER -->
    <div class="support-header">
        <h1>Support & Suggestion Box</h1>
        <p>Your feedback helps us improve AccessMed Connect</p>
    </div>

    <!-- SUGGESTION BOX CARD -->
    <div class="suggestion-container">

        <div class="suggestion-card">
            <h2>📝 Share Your Feedback</h2>

            <p class="info-text">
                Tell us your ideas, issues, or suggestions.  
                Our team reviews every message to improve your experience.
            </p>

            <form class="suggestion-form">

                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Suggestion / Message</label>
                <textarea placeholder="Write your message here..."></textarea>

                <button type="submit" class="submit-btn">Submit</button>

            </form>
        </div>

    </div>

</body>
</html>
