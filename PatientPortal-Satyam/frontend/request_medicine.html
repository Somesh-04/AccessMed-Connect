<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Medicine – AccessMed Connect</title>
    <link rel="stylesheet" href="request_medicine.css">
</head>

<body>

<main class="portal-container">

    <!-- PAGE HEADER (COMPACT, NOT HERO) -->
    <section class="page-header">
        <h2>Request Medicine</h2>
        <p>Submit your medicine requirement</p>
    </section>

    <!-- PATIENT DETAILS -->
    <section class="card">
        <h3>Patient Details</h3>

        <div class="info-grid">
            <div>
                <div class="label">Name</div>
                <div class="value" id="patient-name">—</div>
            </div>

            <div>
                <div class="label">Employee ID</div>
                <div class="value" id="patient-emp-id">—</div>
            </div>

            <div>
                <div class="label">Email ID</div>
                <div class="value" id="patient-email">—</div>
            </div>
        </div>
    </section>

    <!-- MEDICINE REQUEST FORM -->
    <section class="card">
        <h3>Medicine Request Form</h3>

        <form id="medicine-form">

            <div class="form-group">
                <label for="medicine-name">Medicine Name</label>
                <input type="text" id="medicine-name" required>
            </div>

            <div class="form-group">
                <label for="dosage">Dosage</label>
                <input type="text" id="dosage">
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="1" required>
            </div>

            <div class="form-group">
                <label for="remarks">Remarks</label>
                <textarea id="remarks" rows="3"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
            <p id="form-status" class="status"></p>

        </form>
    </section>

    <!-- REQUEST HISTORY -->
    <section class="card">
        <h3>Previous Requests</h3>
        <ul id="request-list" class="list-box">
            <li class="empty">Loading request history...</li>
        </ul>
    </section>

</main>

<footer class="portal-footer">
    © 2025 AccessMed Connect
</footer>

<script src="request_medicine.js"></script>
</body>
</html>
